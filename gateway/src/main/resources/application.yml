spring:
  application:
    name: waylo-gateway
  threads:
    virtual:
      enabled: true # every HTTP request blocks cheaply while waiting for its UDP answer
  mvc:
    problemdetails:
      enabled: true
  # ---- OAuth2 / Keycloak (frontend) -------------------------------------------------------
  # Enables "Authorization: Bearer <JWT>" on POST /request/* in addition to X-API-Key.
  # Spring validates signature (keys from the issuer's JWKS), issuer, expiry and audience.
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         issuer-uri: https://keycloak.example.com/realms/waylo
  #         # optional: skips OIDC discovery at startup (keys are fetched lazily)
  #         jwk-set-uri: https://keycloak.example.com/realms/waylo/protocol/openid-connect/certs
  #         # The token's "aud" claim must contain one of these. Keycloak only adds the API to
  #         # "aud" with an "Audience" protocol mapper on the frontend client (or its client scope).
  #         audiences:
  #           - waylo-api

  # The frontend itself is the OAuth2 client (public client, Authorization Code + PKCE), e.g.
  # in Keycloak: client "waylo-frontend", Client authentication OFF, Standard flow ON,
  # Valid redirect URIs https://app.example.com/*, Web origins https://app.example.com.
  # The gateway does not need client credentials; it only validates the tokens.

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

waylo:
  security:
    # Comma separated list of accepted values for the X-API-Key header.
    api-keys: ${WAYLO_API_KEYS:local-dev-key}
  # ---- CORS for browser frontends (disabled while allowed-origins is empty) -------------------
  # cors:
  #   allowed-origins:
  #     - https://app.example.com
  #     - http://localhost:5173
  #   allowed-methods: [POST, OPTIONS]
  #   # defaults shown; traceparent/tracestate/baggage let a traced frontend continue its trace here
  #   allowed-headers: [Content-Type, Authorization, X-API-Key, traceparent, tracestate, baggage]
  #   exposed-headers: [Retry-After, WWW-Authenticate]
  #   allow-credentials: false   # bearer tokens travel in a header, no cookies needed
  #   max-age: 30m
  dhl:
    host: ${DHL_HOST:localhost}
    port: ${DHL_PORT:9999}
    # How long to wait for an answer to a single datagram before retransmitting it.
    timeout: 500ms
    # Retransmissions after the first attempt. 2 => at most 3 datagrams per request.
    retries: 2
    handshake:
      client-name: waylo-gateway/0.1.0
      # Pause between two failed handshake rounds (each round itself uses timeout/retries).
      retry-backoff: 1s
      # How long an HTTP request waits for the initial handshake before giving up with 503.
      max-wait: 3s
